<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Debug - Crear Noticia</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 2rem; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 10px; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; }
        textarea { height: 100px; }
        button { background: #007bff; color: white; padding: 1rem 2rem; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 1rem; padding: 1rem; border-radius: 4px; white-space: pre-wrap; font-family: monospace; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .debug { background: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Debug - Crear Noticia</h1>
        <p>Esta página ayuda a diagnosticar problemas al crear noticias</p>
        
        <form id="debugForm">
            <div class="form-group">
                <label>Título *</label>
                <input type="text" name="title" value="Noticia de Prueba Debug" required>
            </div>
            
            <div class="form-group">
                <label>Contenido *</label>
                <textarea name="content" required>Este es el contenido de prueba para diagnosticar el problema de creación de noticias.</textarea>
            </div>
            
            <div class="form-group">
                <label>Autor *</label>
                <input type="text" name="author" value="Debug Test" required>
            </div>
            
            <div class="form-group">
                <label>Tipo *</label>
                <select name="type" required>
                    <option value="local">Local</option>
                    <option value="nacional">Nacional</option>
                    <option value="internacional">Internacional</option>
                    <option value="general">General</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Fecha de Publicación *</label>
                <input type="date" name="published_at" required>
            </div>
            
            <div class="form-group">
                <label>Estado *</label>
                <select name="status" required>
                    <option value="published">Publicado</option>
                    <option value="draft">Borrador</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>
                    <input type="checkbox" name="is_featured" value="1"> Noticia destacada
                </label>
            </div>
            
            <div class="form-group">
                <label>Imagen (opcional)</label>
                <input type="file" name="image" accept="image/*">
            </div>
            
            <button type="submit">🔍 Crear Noticia (Debug)</button>
        </form>
        
        <div id="debugResult" class="result" style="display: none;"></div>
        
        <hr style="margin: 2rem 0;">
        
        <h2>🧪 Pruebas Adicionales</h2>
        <button onclick="testAPI()">Test API Básico</button>
        <button onclick="testValidation()">Test Validación</button>
        <button onclick="checkLogs()">Ver Logs</button>
        
        <div id="testResults" class="result" style="display: none;"></div>
    </div>

    <script>
        // Set default date
        document.querySelector('input[name="published_at"]').value = new Date().toISOString().split('T')[0];

        document.getElementById('debugForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const resultDiv = document.getElementById('debugResult');
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            submitBtn.disabled = true;
            submitBtn.textContent = '🔄 Creando...';
            resultDiv.style.display = 'block';
            resultDiv.className = 'result debug';
            resultDiv.textContent = '🔄 Enviando datos...';
            
            try {
                const formData = new FormData(this);
                
                // Debug: Show what we're sending
                console.log('=== DEBUG: Datos a enviar ===');
                for (let [key, value] of formData.entries()) {
                    console.log(`${key}:`, value);
                }
                
                resultDiv.textContent = '📤 Datos preparados, enviando a API...\n\n';
                
                // Add debug info to result
                let debugInfo = '=== DATOS ENVIADOS ===\n';
                for (let [key, value] of formData.entries()) {
                    debugInfo += `${key}: ${value}\n`;
                }
                resultDiv.textContent += debugInfo + '\n';
                
                const response = await fetch('/test-admin-api/news', {
                    method: 'POST',
                    body: formData
                });
                
                resultDiv.textContent += `📡 Respuesta HTTP: ${response.status} ${response.statusText}\n\n`;
                
                const result = await response.json();
                
                resultDiv.textContent += '=== RESPUESTA DEL SERVIDOR ===\n';
                resultDiv.textContent += JSON.stringify(result, null, 2);
                
                if (result.success) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = '✅ ¡ÉXITO! Noticia creada correctamente\n\n' + resultDiv.textContent;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = '❌ ERROR: ' + (result.message || 'Error desconocido') + '\n\n' + resultDiv.textContent;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ ERROR DE CONEXIÓN: ${error.message}\n\n` + resultDiv.textContent;
                console.error('Error:', error);
            }
            
            submitBtn.disabled = false;
            submitBtn.textContent = '🔍 Crear Noticia (Debug)';
        });

        async function testAPI() {
            const resultDiv = document.getElementById('testResults');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result debug';
            resultDiv.textContent = '🧪 Probando API básica...\n\n';
            
            try {
                // Test GET
                const getResponse = await fetch('/test-admin-api/news');
                const getData = await getResponse.json();
                
                resultDiv.textContent += `✅ GET /test-admin-api/news: ${getResponse.status}\n`;
                resultDiv.textContent += `Noticias encontradas: ${getData.data?.items?.length || 0}\n\n`;
                
                // Test route exists
                resultDiv.textContent += '🔍 Verificando rutas...\n';
                
                resultDiv.className = 'result success';
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent += `❌ Error en test API: ${error.message}\n`;
            }
        }

        async function testValidation() {
            const resultDiv = document.getElementById('testResults');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result debug';
            resultDiv.textContent = '🧪 Probando validación...\n\n';
            
            try {
                // Test with minimal data
                const testData = new FormData();
                testData.append('title', 'Test Validación');
                testData.append('content', 'Contenido de prueba');
                testData.append('author', 'Test');
                testData.append('type', 'local');
                testData.append('published_at', '2025-10-15');
                testData.append('status', 'published');
                
                const response = await fetch('/test-admin-api/news', {
                    method: 'POST',
                    body: testData
                });
                
                const result = await response.json();
                
                resultDiv.textContent += `📡 Status: ${response.status}\n`;
                resultDiv.textContent += `Respuesta: ${JSON.stringify(result, null, 2)}\n`;
                
                if (result.success) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = '✅ Validación OK\n\n' + resultDiv.textContent;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = '❌ Error de validación\n\n' + resultDiv.textContent;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent += `❌ Error: ${error.message}\n`;
            }
        }

        function checkLogs() {
            const resultDiv = document.getElementById('testResults');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result debug';
            resultDiv.textContent = '📋 Para ver los logs del servidor:\n\n';
            resultDiv.textContent += '1. Abre terminal en el proyecto\n';
            resultDiv.textContent += '2. Ejecuta: tail -f storage/logs/laravel.log\n';
            resultDiv.textContent += '3. Intenta crear una noticia\n';
            resultDiv.textContent += '4. Observa los mensajes de log\n\n';
            resultDiv.textContent += 'O revisa el archivo: storage/logs/laravel.log';
        }
    </script>
</body>
</html>
